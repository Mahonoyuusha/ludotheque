<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma Ludothèque</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="title">Ma Ludothèque</h1>
        <nav>
          <ul class="nav">
            <li><a id="homeLink" href="#home">Accueil</a></li>
            <li><a id="ownedLink" href="#ludotheque">Ma Ludothèque</a></li>
            <li><a id="wishlistLink" href="#wishlist">Wishlist</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div class="toolbar-left" id="toolbar-left"></div>
        <div class="toolbar-right" id="toolbar-right">
          <input id="searchInput" class="search" type="search" placeholder="Rechercher un jeu..." />
        </div>
      </section>
      <section class="galerie" id="galerie"></section>
    </main>

    <div class="modale hidden" id="modale-jeu" aria-hidden="true">
      <div class="modale-backdrop" id="modale-backdrop"></div>
      <div class="modale-dialog" role="dialog" aria-modal="true">
        <button class="modale-close" id="modale-close" aria-label="Fermer">×</button>
        <div id="modale-content"></div>
      </div>
    </div>

    <footer class="footer container">
      <small>© Ma Ludothèque</small>
    </footer>

    <noscript>Activez JavaScript pour utiliser l'application.</noscript>
    <script src="script.js" defer></script>
  </body>
  </html>
